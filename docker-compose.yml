version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mingli
      POSTGRES_PASSWORD: mingli123
      POSTGRES_DB: mingli
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mingli"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://mingli:mingli123@db:5432/mingli
      JWT_SECRET: mingli-fate-secret-key-2024
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npm run db:push && npm start"

volumes:
  pgdata:
